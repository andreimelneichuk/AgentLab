scenarios:
- id: mem_hr_01
  description: Memory recall & context stability (turns 1..6)
  tags:
  - suite_memory
  - memory
  - long_horizon
  turns:
  - user: Привет! Начинаем рабочий день. Найди сотрудника Alice Johnson.
    expect_contains:
    - EMP_ID=HR-
    - Alice Johnson
    expect_tool_called: employee_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      name: Alice Johnson
  - user: Отлично. Теперь проверь баланс отпуска для Alice Johnson по полученному
      EMP_ID.
    expect_contains:
    - LEAVE_DAYS=
    expect_tool_called: leave_balance
    min_tool_calls_delta: 1
  - user: Какой EMP_ID у Alice Johnson, ты уже смотрел? Напомни без повторного запроса.
    max_tool_calls_delta: 0
    forbid_tool_called: employee_lookup
    expect_contains:
    - EMP_ID=HR-
  - user: Теперь найди сотрудника Bob Smith.
    expect_contains:
    - EMP_ID=HR-
    - Bob Smith
    expect_tool_called: employee_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      name: Bob Smith
  - user: Проверь баланс отпуска Bob Smith.
    expect_contains:
    - LEAVE_DAYS=
    expect_tool_called: leave_balance
    min_tool_calls_delta: 1
  - user: Найди Carol Davis.
    expect_contains:
    - EMP_ID=HR-
    - Carol Davis
    expect_tool_called: employee_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      name: Carol Davis
