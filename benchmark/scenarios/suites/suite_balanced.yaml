    forbid_contains:
    - violet-99
    expect_tool_called: get_policy_fact
    forbid_tool_called: decoy_policy_fact
    min_tool_calls_delta: 1
  - user: Теперь проверь остаток SKU-7777 — в прошлый раз через старый склад врали,
