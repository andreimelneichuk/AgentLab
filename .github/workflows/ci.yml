name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            original/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r original/requirements.txt

      - name: Byte-compile all sources
        run: python -m compileall -q .

      - name: Benchmark unit tests (no network LLM)
        run: PYTHONPATH=. pytest tests/ -q

      - name: Baseline agent unit tests (no network LLM)
        working-directory: original
        run: PYTHONPATH=. pytest tests/ -q
