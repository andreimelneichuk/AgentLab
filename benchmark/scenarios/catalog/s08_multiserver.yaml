    expect_contains:
    - WEATHER
    - Singapore
    expect_tool_called: weather_city
    min_tool_calls_delta: 1
    expect_tool_args:
      city: Singapore
  - user: 'Переведи брифинг на китайский: ''The partnership meeting is scheduled for
      Thursday at 14:00 local time.'''
    expect_contains:
    - TRANSLATED[zh]
    expect_tool_called: translate_text
    min_tool_calls_delta: 1
    expect_tool_args:
      target_lang: zh
      text: The partnership meeting is scheduled for Thursday at 14:00 local time.
  - user: Найди на месте James Chen — наш контакт в Сингапуре
    expect_contains:
    - EMP_ID=HR-
    - James Chen
    expect_tool_called: employee_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      name: James Chen
  - user: Напомни погоду в Сингапуре и перевод брифинга на китайский
    expect_contains:
    - Singapore
    - TRANSLATED[zh]
    max_tool_calls_delta: 0
    forbid_tool_called: employee_lookup
  - user: 'Итог командировки: контакт James Chen с HR ID, город и перевод брифинга'
    expect_contains:
    - James Chen
    - Singapore
    - TRANSLATED[zh]
    expect_contains_mode: all
    max_tool_calls_delta: 0
- id: s08_005
  description: 'Финансовый аудит: два счёта, суммирование расходов, остатки склада,
    финансовый recall'
  tags:
  - catalog
  - tool
  - long_horizon
  - multiserver
  turns:
  - user: Начинаем бюджетный аудит. Открой первый счёт — INV-2024-A01
    expect_contains:
    - INVOICE=INV-2024-A01
    - AMOUNT=
    expect_tool_called: invoice_get
    min_tool_calls_delta: 1
    expect_tool_args:
      invoice_id: INV-2024-A01
  - user: Теперь второй — INV-2024-B02
    expect_contains:
    - INVOICE=INV-2024-B02
    - AMOUNT=
    expect_tool_called: invoice_get
    min_tool_calls_delta: 1
    expect_tool_args:
      invoice_id: INV-2024-B02
  - user: 'Оба счёта на сумму 12500 каждый. Посчитай суммарный расход: 12500+12500.'
    expect_contains:
    - RESULT=25000
    expect_tool_called: calc_expression
    min_tool_calls_delta: 1
    expect_tool_args:
      expression: 12500+12500
  - user: Проверь остатки по артикулу SKU-8800 — сверяем с накладными.
    expect_contains:
    - SKU-8800
    - WH-01
    expect_tool_called: inventory_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      sku: SKU-8800
  - user: Какие два счёта мы смотрели и какой суммарный расход получился?
    expect_contains:
    - INV-2024-A01
    - INV-2024-B02
    - '25000'
    max_tool_calls_delta: 0
  - user: 'Финансовое резюме: оба счёта, итоговая сумма, наличие SKU-8800 на складе.'
    expect_contains:
    - INV-2024-A01
    - '25000'
    - SKU-8800
    expect_contains_mode: all
    max_tool_calls_delta: 0
