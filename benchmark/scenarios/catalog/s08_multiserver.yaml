    - Sergei Nikolaev
    - LEAVE_DAYS=
    max_tool_calls_delta: 0
  - user: 'Итоговый HR-отчёт: сотрудник, остаток отпуска, расчётная стоимость замены.'
    expect_contains:
    - Sergei Nikolaev
    - '25500'
    - LEAVE_DAYS=
    expect_contains_mode: all
    max_tool_calls_delta: 0
