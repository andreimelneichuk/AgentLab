- id: mem_multi_03
  description: Memory recall & context stability (turns 13..18)
  tags:
  - balanced
  - long_horizon
  - memory
  - suite_balanced
  - suite_memory
  turns:
  - user: Напомни, какой EMP_ID получился у Alice Johnson?
    max_tool_calls_delta: 0
    forbid_tool_called: employee_lookup
    expect_contains:
    - EMP_ID=HR-
  - user: Не вызывая инструменты — какой tier у клиента C-EMEA-001?
    max_tool_calls_delta: 0
    forbid_tool_called: customer_get
    expect_contains:
    - TIER=
  - user: Покажи организационную структуру отдела Engineering.
    expect_contains:
    - DEPT=Engineering
    - ROLES=
    expect_tool_called: org_chart_dept
    min_tool_calls_delta: 1
    expect_tool_args:
      department: Engineering
  - user: Теперь org chart для отдела Sales.
    expect_contains:
    - DEPT=Sales
    - ROLES=
    expect_tool_called: org_chart_dept
    min_tool_calls_delta: 1
    expect_tool_args:
      department: Sales
  - user: Планируется командировка в Берлин. Какая там сейчас погода?
    expect_contains:
    - WEATHER
    - Berlin
    expect_tool_called: weather_city
    min_tool_calls_delta: 1
    expect_tool_args:
      city: Berlin
  - user: Также проверь погоду в Токио.
    expect_contains:
    - WEATHER
    - Tokyo
    expect_tool_called: weather_city
    min_tool_calls_delta: 1
    expect_tool_args:
      city: Tokyo
