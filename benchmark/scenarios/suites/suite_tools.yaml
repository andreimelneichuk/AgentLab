  tags:
  - catalog
  - s06
  - suite_tools
  - tier1
  - tool
  - tools
  turns:
  - user: Через 10 минут звонок клиенту CUST-555 — открой его карточку, хочу освежить
      в памяти детали.
    expect_contains:
    - CUSTOMER=CUST-555
    - TIER
    - REGION
    expect_tool_called: customer_get
    min_tool_calls_delta: 1
    expect_tool_args:
      customer_id: CUST-555
- id: s06_002
  description: 'r_dt: «посмотри клиента» — агент использует customer_get, не decoy_customer_lookup,
    с expect_tool_args'
  tags:
  - catalog
  - r_dt
  - s06
  - suite_tools
  - tier1
  - tool
  - tools
  turns:
  - user: Посмотри клиента CUST-210 — нужна актуальная информация.
    expect_contains:
    - CUSTOMER=CUST-210
    - TIER
    expect_tool_called: customer_get
    forbid_tool_called: decoy_customer_lookup
    forbid_contains:
    - TIER=bronze
    min_tool_calls_delta: 1
    expect_tool_args:
      customer_id: CUST-210
