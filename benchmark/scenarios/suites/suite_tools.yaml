scenarios:
- id: s01_001
  description: DevOps проверяет живость MCP endpoint через benchmark_probe и маркер
  tags:
  - catalog
  - smoke
  - suite_tools
  - tools
  turns:
  - user: Слушай, не уверен что бэкенд вообще поднят — глянь живой ли сервис и скажи
      какой там маркер
    expect_contains:
    - orchid-17
    expect_tool_called: benchmark_probe
    min_tool_calls_delta: 1
- id: s01_002
  description: Мониторинг запрашивает healthcheck — маркер + краткий статус
  tags:
  - catalog
  - suite_tools
  - tools
  turns:
  - user: Алерт кричит что сервис может лежать — чекни плз и коротко напиши статус
    expect_contains:
    - orchid-17
    expect_tool_called: benchmark_probe
    min_tool_calls_delta: 1
    expect_regex:
    - (ок|работ|здоров|active|up|live)
- id: s01_003
  description: Пользователь считает стоимость 3 серверов по 850 $/мес через calc_expression
  tags:
  - catalog
  - suite_tools
  - tools
  turns:
  - user: 'Хочу прикинуть расходы на инфру: три сервера по 850 баксов в месяц. Сколько
      в месяц выйдет?'
    expect_contains:
    - '2550'
    expect_tool_called: calc_expression
    min_tool_calls_delta: 1
    expect_tool_args:
      expression: 3*850
- id: s01_004
  description: Финансист рассчитывает ROI инвестиций через calc_expression с проверкой
    аргументов
  tags:
  - catalog
  - critical
  - suite_tools
  - tools
  turns:
  - user: 'Нужен ROI по проекту: вложили 45 000, выручка 120 000. Формула (доход −
      затраты) / затраты × 100. Посчитай % возврата'
    expect_contains:
    - RESULT=
    expect_tool_called: calc_expression
    min_tool_calls_delta: 1
    expect_tool_args:
      expression: (120000-45000)/45000*100
- id: s02_001
  description: Разработчик ищет документацию по asyncio через правильный tool, не
    decoy
  tags:
  - catalog
  - s02
  - suite_tools
  - tier1
  - tool
  - tools
  turns:
  - user: Нужна дока по asyncio — как корутины запускать и event loop юзать
    expect_contains:
    - REF=PYDOC-778
    - asyncio
    expect_tool_called: python_doc_lookup
    forbid_tool_called: decoy_python_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      topic: asyncio
- id: s02_002
  description: Тимлид просит объяснить decorators с примерами — lookup на первом ходу,
    recall без tool на втором
  tags:
  - catalog
  - instruction
  - s02
  - suite_tools
  - tier2
  - tool
  - tools
  turns:
  - user: Объясни decorators в Python на примерах — глянь актуальную доку
    expect_contains:
    - REF=PYDOC-778
    - decorator
    expect_tool_called: python_doc_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      topic: decorators
  - user: Ок, а какие примеры использования там были? Коротко перечисли
    expect_contains:
    - decorator
    max_tool_calls_delta: 0
    forbid_tool_called: python_doc_lookup
- id: s03_001
  tags:
  - catalog
  - smoke
  - suite_tools
  - tools
  - weather
  turns:
  - user: Лечу в Лондон на след неделе — какая там погода, чтобы понять что брать?
    expect_contains:
    - WEATHER
    expect_tool_called: weather_city
    min_tool_calls_delta: 1
    expect_tool_args:
      city: London
- id: s03_002
  tags:
  - catalog
  - suite_tools
  - tools
  - weather
  turns:
  - user: Тимбилдинг в Токио — какая там погода? Решаем, на улице делать или нет
    expect_contains:
    - WEATHER
    expect_tool_called: weather_city
    min_tool_calls_delta: 1
    expect_tool_args:
      city: Tokyo
- id: s05_001
  description: HR-менеджер ищет профиль нового коллеги Dmitry Orlov перед онбордингом
  tags:
  - catalog
  - smoke
  - suite_tools
  - tools
  turns:
  - user: Завтра выходит новый сотрудник Dmitry Orlov — найди его профиль в системе,
      мне нужно подготовиться к онбордингу
    expect_contains:
    - EMP_ID=
    - NAME=Dmitry Orlov
    expect_tool_called: employee_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      name: Dmitry Orlov
- id: s05_002
  description: 'r_dt: CEO просит найти сотрудника — правильный employee_lookup, не
    decoy_employee_search'
  tags:
  - catalog
  - r_dt
  - suite_tools
  - tools
  turns:
  - user: Найди сотрудника Sarah Mitchell в нашей системе
    expect_contains:
    - EMP_ID=
    - DEPT=
    expect_tool_called: employee_lookup
    forbid_tool_called: decoy_employee_search
    min_tool_calls_delta: 1
    expect_tool_args:
      name: Sarah Mitchell
- id: s05_003
  description: 'Профиль + recall: найти Maria Chen, затем уточнить её DEPT без повторного
    вызова'
  tags:
  - catalog
  - instruction
  - suite_tools
  - tools
  turns:
  - user: Найди в системе профиль Maria Chen
    expect_contains:
    - EMP_ID=
    - DEPT=
    expect_tool_called: employee_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      name: Maria Chen
  - user: А напомни — в каком отделе работает Maria Chen? Мы же только что смотрели
      её профиль
    expect_contains:
    - DEPT=
    max_tool_calls_delta: 0
    forbid_tool_called: employee_lookup
- id: s05_004
  description: Сотрудник спрашивает остаток своего отпуска по известному emp_id HR-B3C4D5
  tags:
  - catalog
  - suite_tools
  - tools
  turns:
  - user: Мой ID сотрудника HR-B3C4D5 — сколько дней отпуска у меня осталось?
    expect_contains:
    - LEAVE_DAYS=
    - emp_id=HR-B3C4D5
    expect_tool_called: leave_balance
    min_tool_calls_delta: 1
    expect_tool_args:
      emp_id: HR-B3C4D5
- id: s05_005
  description: 'Цепочка: employee_lookup для James Park → leave_balance с emp_id из
    ответа'
  tags:
  - catalog
  - suite_tools
  - tools
  turns:
  - user: Найди сотрудника James Park в системе
    expect_contains:
    - EMP_ID=
    expect_tool_called: employee_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      name: James Park
  - user: Отлично. Теперь проверь, сколько дней отпуска у него осталось
    expect_contains:
    - LEAVE_DAYS=
    expect_tool_called: leave_balance
    min_tool_calls_delta: 1
- id: s05_006
  description: 'r_dt + отпуск: проверить баланс отпуска — правильный leave_balance
    с expect_tool_args'
  tags:
  - catalog
  - r_dt
  - suite_tools
  - tools
  turns:
  - user: Сколько дней отпуска осталось у сотрудника HR-F7G8H9?
    expect_contains:
    - LEAVE_DAYS=
    expect_tool_called: leave_balance
    forbid_tool_called: decoy_employee_search
    min_tool_calls_delta: 1
    expect_tool_args:
      emp_id: HR-F7G8H9
- id: s05_007
  description: Оргструктура отдела Marketing — org_chart_dept
