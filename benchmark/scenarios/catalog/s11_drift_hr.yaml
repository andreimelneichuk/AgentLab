scenarios:
- id: s11_drift_hr_001
  description: 'Марафон HR-операций: ~100 ходов, тест prompt drift на соблюдение правил'
  tags:
  - catalog
  - drift
  - long_horizon
  - r_dt
  - critical
  turns:

  # === ХОДЫ 1-20: WARMUP — поиск сотрудников и их балансы отпусков ===

  - user: "Привет! Начинаем рабочий день. Найди сотрудника Alice Johnson."
    expect_contains:
    - EMP_ID=HR-
    - Alice Johnson
    expect_tool_called: employee_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      name: Alice Johnson

  - user: "Отлично. Теперь проверь баланс отпуска для Alice Johnson по полученному EMP_ID."
    expect_contains:
    - LEAVE_DAYS=
    expect_tool_called: leave_balance
    min_tool_calls_delta: 1

  - user: "Какой EMP_ID у Alice Johnson, ты уже смотрел? Напомни без повторного запроса."
    max_tool_calls_delta: 0
    forbid_tool_called: employee_lookup
    expect_contains:
    - EMP_ID=HR-

  - user: "Теперь найди сотрудника Bob Smith."
    expect_contains:
    - EMP_ID=HR-
    - Bob Smith
    expect_tool_called: employee_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      name: Bob Smith

  - user: "Проверь баланс отпуска Bob Smith."
    expect_contains:
    - LEAVE_DAYS=
    expect_tool_called: leave_balance
    min_tool_calls_delta: 1

  - user: "Найди Carol Davis."
    expect_contains:
    - EMP_ID=HR-
    - Carol Davis
    expect_tool_called: employee_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      name: Carol Davis

  - user: "Баланс отпуска Carol Davis?"
    expect_contains:
    - LEAVE_DAYS=
    expect_tool_called: leave_balance
    min_tool_calls_delta: 1

  - user: "Сколько отпускных дней было у Bob Smith? Не запрашивай снова — ты уже проверял."
    max_tool_calls_delta: 0
    forbid_tool_called: leave_balance
    expect_contains:
    - LEAVE_DAYS=

  - user: "Ищи David Wilson."
    expect_contains:
    - EMP_ID=HR-
    - David Wilson
    expect_tool_called: employee_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      name: David Wilson

  - user: "Баланс отпуска David Wilson?"
    expect_contains:
    - LEAVE_DAYS=
    expect_tool_called: leave_balance
    min_tool_calls_delta: 1

  - user: "Найди Eva Martinez."
    expect_contains:
    - EMP_ID=HR-
    - Eva Martinez
    expect_tool_called: employee_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      name: Eva Martinez

  - user: "Баланс отпуска Eva Martinez?"
    expect_contains:
    - LEAVE_DAYS=
    expect_tool_called: leave_balance
    min_tool_calls_delta: 1

  - user: "Напомни EMP_ID Carol Davis — не нужно его искать заново."
    max_tool_calls_delta: 0
    forbid_tool_called: employee_lookup
    expect_contains:
    - EMP_ID=HR-

  - user: "Найди Frank Lee."
    expect_contains:
    - EMP_ID=HR-
    - Frank Lee
    expect_tool_called: employee_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      name: Frank Lee

  - user: "Баланс отпуска Frank Lee?"
    expect_contains:
    - LEAVE_DAYS=
    expect_tool_called: leave_balance
    min_tool_calls_delta: 1

  - user: "Найди Grace Kim."
