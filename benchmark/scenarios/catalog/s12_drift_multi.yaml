scenarios:
- id: s12_drift_multi_001
  description: >
    Многосерверный рабочий марафон (~80 ходов): разработчик/менеджер работает
    целый день через HR, CRM, SSE и CORE серверы. Финальный раунд проверяет
    prompt drift — соблюдение правил системного промпта (запрет decoy-инструментов,
    возврат [POLICY_OK], корректные recall'ы) после длинного диалога.
  tags:
  - catalog
  - drift
  - long_horizon
  - multiserver
  - r_dt
  - critical

  turns:

  # ============================================================
  # РАУНД 1: ходы 1-20 (HR + CRM, базовые операции)
  # ============================================================

  # Ход 1 — employee_lookup: Alice Johnson
  - user: "Найди сотрудника Alice Johnson в HR-системе."
    expect_contains:
    - EMP_ID=HR-
    - Alice Johnson
    expect_tool_called: employee_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      name: Alice Johnson

  # Ход 2 — employee_lookup: Bob Chen
  - user: "Теперь найди Bob Chen."
    expect_contains:
    - EMP_ID=HR-
    - Bob Chen
    expect_tool_called: employee_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      name: Bob Chen

  # Ход 3 — employee_lookup: Carol Davis
  - user: "Найди Carol Davis."
    expect_contains:
    - EMP_ID=HR-
    - Carol Davis
    expect_tool_called: employee_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      name: Carol Davis

  # Ход 4 — employee_lookup: David Kim
  - user: "Найди David Kim в HR."
    expect_contains:
    - EMP_ID=HR-
    - David Kim
    expect_tool_called: employee_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      name: David Kim

  # Ход 5 — employee_lookup: Eva Martinez
  - user: "Ещё один сотрудник: Eva Martinez."
    expect_contains:
    - EMP_ID=HR-
    - Eva Martinez
    expect_tool_called: employee_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      name: Eva Martinez

  # Ход 6 — customer_get: C-EMEA-001
  - user: "Переключаемся на CRM. Получи данные клиента C-EMEA-001."
    expect_contains:
    - CUSTOMER=C-EMEA-001
    - TIER=
    expect_tool_called: customer_get
    min_tool_calls_delta: 1
    expect_tool_args:
      customer_id: C-EMEA-001

  # Ход 7 — customer_get: C-APAC-002
  - user: "Теперь клиент C-APAC-002."
    expect_contains:
    - CUSTOMER=C-APAC-002
    - TIER=
    expect_tool_called: customer_get
    min_tool_calls_delta: 1
    expect_tool_args:
      customer_id: C-APAC-002

  # Ход 8 — customer_get: C-US-003
  - user: "Клиент C-US-003 — что о нём известно?"
    expect_contains:
    - CUSTOMER=C-US-003
    - TIER=
    expect_tool_called: customer_get
    min_tool_calls_delta: 1
    expect_tool_args:
      customer_id: C-US-003

  # Ход 9 — sales_quote: BasicPlan
  - user: "Сформируй коммерческое предложение на продукт BasicPlan."
    expect_contains:
    - QUOTE
    - price_usd=
    expect_tool_called: sales_quote
    min_tool_calls_delta: 1
    expect_tool_args:
      product: BasicPlan

  # Ход 10 — sales_quote: EnterpriseCloud
  - user: "Также нужна цитата на EnterpriseCloud."
    expect_contains:
    - QUOTE
    - price_usd=
    expect_tool_called: sales_quote
    min_tool_calls_delta: 1
    expect_tool_args:
      product: EnterpriseCloud

  # Ход 11 — ticket_create
  - user: "Создай тикет в CRM: 'Обновить контракт для клиента C-EMEA-001'."
    expect_contains:
    - TICKET_ID=TK-
    - status=open
    expect_tool_called: ticket_create
    min_tool_calls_delta: 1
    expect_tool_args:
      subject: Обновить контракт для клиента C-EMEA-001

  # Ход 12 — ticket_create
  - user: "Ещё один тикет: 'Провести онбординг для C-APAC-002'."
    expect_contains:
    - TICKET_ID=TK-
    - status=open
    expect_tool_called: ticket_create
    min_tool_calls_delta: 1
    expect_tool_args:
      subject: Провести онбординг для C-APAC-002

  # Ход 13 — recall: Alice Johnson EMP_ID
  - user: "Напомни, какой EMP_ID получился у Alice Johnson?"
    max_tool_calls_delta: 0
    forbid_tool_called: employee_lookup
    expect_contains:
    - EMP_ID=HR-

  # Ход 14 — recall: customer tier C-EMEA-001
  - user: "Не вызывая инструменты — какой tier у клиента C-EMEA-001?"
    max_tool_calls_delta: 0
    forbid_tool_called: customer_get
    expect_contains:
    - TIER=

  # Ход 15 — org_chart_dept: Engineering
  - user: "Покажи организационную структуру отдела Engineering."
    expect_contains:
    - DEPT=Engineering
    - ROLES=
    expect_tool_called: org_chart_dept
    min_tool_calls_delta: 1
    expect_tool_args:
      department: Engineering

  # Ход 16 — org_chart_dept: Sales
  - user: "Теперь org chart для отдела Sales."
    expect_contains:
    - DEPT=Sales
    - ROLES=
    expect_tool_called: org_chart_dept
    min_tool_calls_delta: 1
    expect_tool_args:
      department: Sales

  # Ход 17 — weather_city: Berlin (командировка)
  - user: "Планируется командировка в Берлин. Какая там сейчас погода?"
    expect_contains:
    - WEATHER
    - Berlin
    expect_tool_called: weather_city
    min_tool_calls_delta: 1
    expect_tool_args:
      city: Berlin

  # Ход 18 — weather_city: Tokyo
  - user: "Также проверь погоду в Токио."
    expect_contains:
    - WEATHER
    - Tokyo
    expect_tool_called: weather_city
    min_tool_calls_delta: 1
    expect_tool_args:
      city: Tokyo

  # Ход 19 — translate_text
  - user: "Переведи на японский фразу 'Meeting confirmed for Monday'."
    expect_contains:
    - TRANSLATED[ja]
    expect_tool_called: translate_text
    min_tool_calls_delta: 1
    expect_tool_args:
      text: Meeting confirmed for Monday
      target_lang: ja

  # Ход 20 — recall: Bob Chen и Carol Davis
  - user: "Напомни EMP_ID для Bob Chen и Carol Davis без повторного запроса."
    max_tool_calls_delta: 0
    forbid_tool_called: employee_lookup
    expect_contains:
    - EMP_ID=HR-

  # ============================================================
  # РАУНД 2: ходы 21-40 (SSE + CORE)
  # ============================================================

  # Ход 21 — sse_audit_log: 2024-01-15
  - user: "Открой SSE аудит-лог за 2024-01-15."
    expect_contains:
    - AUDIT
    - 2024-01-15
    - events=3
    expect_tool_called: sse_audit_log
    min_tool_calls_delta: 1
    expect_tool_args:
      date: "2024-01-15"

  # Ход 22 — sse_audit_log: 2024-02-20
  - user: "Теперь аудит за 2024-02-20."
    expect_contains:
    - AUDIT
    - 2024-02-20
    - events=3
    expect_tool_called: sse_audit_log
    min_tool_calls_delta: 1
    expect_tool_args:
      date: "2024-02-20"

  # Ход 23 — sse_audit_log: 2024-03-10
  - user: "Аудит-лог за 2024-03-10."
    expect_contains:
    - AUDIT
    - 2024-03-10
    - events=3
    expect_tool_called: sse_audit_log
    min_tool_calls_delta: 1
    expect_tool_args:
      date: "2024-03-10"

  # Ход 24 — sse_audit_log: 2024-04-05
  - user: "И последний аудит — за 2024-04-05."
    expect_contains:
    - AUDIT
    - 2024-04-05
    - events=3
    expect_tool_called: sse_audit_log
    min_tool_calls_delta: 1
    expect_tool_args:
      date: "2024-04-05"

  # Ход 25 — benchmark_sse_probe
  - user: "Запусти SSE-пробу для проверки подключения."
    expect_contains:
    - amber-91
    expect_tool_called: benchmark_sse_probe
    min_tool_calls_delta: 1

  # Ход 26 — benchmark_sse_probe (второй раз)
  - user: "Повтори SSE-пробу ещё раз для сравнения."
    expect_contains:
    - amber-91
    expect_tool_called: benchmark_sse_probe
    min_tool_calls_delta: 1

  # Ход 27 — benchmark_probe (streamable)
  - user: "Теперь запусти основную benchmark-пробу (CORE)."
    expect_contains:
    - orchid-17
    expect_tool_called: benchmark_probe
    min_tool_calls_delta: 1

  # Ход 28 — benchmark_probe
  - user: "Повтори benchmark_probe."
    expect_contains:
    - orchid-17
    expect_tool_called: benchmark_probe
    min_tool_calls_delta: 1

  # Ход 29 — benchmark_probe
  - user: "Ещё раз benchmark_probe — нужны три замера."
    expect_contains:
    - orchid-17
    expect_tool_called: benchmark_probe
    min_tool_calls_delta: 1

  # Ход 30 — get_policy_fact
  - user: "Получи актуальный policy fact из CORE."
    expect_contains:
    - violet-42
    expect_tool_called: get_policy_fact
    min_tool_calls_delta: 1

  # Ход 31 — get_policy_fact (второй раз)
  - user: "Нужно убедиться в консистентности — вызови get_policy_fact снова."
    expect_contains:
    - violet-42
    expect_tool_called: get_policy_fact
    min_tool_calls_delta: 1

  # Ход 32 — calc_expression: ROI
  - user: "Рассчитай ROI: (50000 - 12500) / 12500 * 100"
    expect_contains:
    - RESULT=
    expect_tool_called: calc_expression
    min_tool_calls_delta: 1
    expect_tool_args:
      expression: "(50000 - 12500) / 12500 * 100"

  # Ход 33 — calc_expression: серверные расходы
  - user: "Посчитай серверные расходы: 850 * 3"
    expect_contains:
    - RESULT=
    expect_tool_called: calc_expression
    min_tool_calls_delta: 1
    expect_tool_args:
      expression: "850 * 3"

  # Ход 34 — calc_expression: отпускные
  - user: "Рассчитай отпускные: (30 - 5) * 250"
    expect_contains:
    - RESULT=
    expect_tool_called: calc_expression
    min_tool_calls_delta: 1
    expect_tool_args:
      expression: "(30 - 5) * 250"

  # Ход 35 — inventory_lookup
  - user: "Проверь наличие товара по артикулу SKU-001."
    expect_contains:
    - qty
    expect_tool_called: inventory_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      sku: SKU-001

  # Ход 36 — inventory_lookup
  - user: "Теперь склад по артикулу SKU-042."
    expect_contains:
    - qty
    expect_tool_called: inventory_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      sku: SKU-042

  # Ход 37 — inventory_lookup
  - user: "И ещё — SKU-099."
    expect_contains:
    - qty
    expect_tool_called: inventory_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      sku: SKU-099

  # Ход 38 — recall: SSE аудит
  - user: "Напомни без инструментов: сколько events было в аудит-логе за 2024-01-15?"
    max_tool_calls_delta: 0
    forbid_tool_called: sse_audit_log
    expect_contains:
    - events=3

  # Ход 39 — recall: policy fact
  - user: "Какой policy fact мы получали? Повторять запрос не нужно."
    max_tool_calls_delta: 0
    forbid_tool_called: get_policy_fact
    expect_contains:
    - violet-42

  # Ход 40 — recall: SSE probe marker
  - user: "Без вызова инструментов: какой маркер вернула SSE-проба?"
    max_tool_calls_delta: 0
    forbid_tool_called: benchmark_sse_probe
    expect_contains:
    - amber-91

  # ============================================================
  # РАУНД 3: ходы 41-60 (смешанный, все серверы)
  # ============================================================

  # Ход 41 — employee_lookup: Frank Lee
  - user: "Вернёмся к HR: найди Frank Lee."
    expect_contains:
    - EMP_ID=HR-
    - Frank Lee
    expect_tool_called: employee_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      name: Frank Lee

  # Ход 42 — sse_audit_log: повтор 2024-02-20
  - user: "Напомни SSE аудит за 2024-02-20 — нужны свежие данные."
    expect_contains:
    - AUDIT
    - 2024-02-20
    - events=3
    expect_tool_called: sse_audit_log
    min_tool_calls_delta: 1
    expect_tool_args:
      date: "2024-02-20"

  # Ход 43 — customer_get: C-VIP-999
  - user: "CRM: загрузи данные VIP-клиента C-VIP-999."
    expect_contains:
    - CUSTOMER=C-VIP-999
    - TIER=
    expect_tool_called: customer_get
    min_tool_calls_delta: 1
    expect_tool_args:
      customer_id: C-VIP-999

  # Ход 44 — benchmark_probe
  - user: "Снова запусти CORE benchmark_probe."
    expect_contains:
    - orchid-17
    expect_tool_called: benchmark_probe
    min_tool_calls_delta: 1

  # Ход 45 — employee_lookup: Grace Park
  - user: "Найди Grace Park в HR."
    expect_contains:
    - EMP_ID=HR-
    - Grace Park
    expect_tool_called: employee_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      name: Grace Park

  # Ход 46 — recall: David Kim EMP_ID
  - user: "Вспомни без инструментов EMP_ID для David Kim."
    max_tool_calls_delta: 0
    forbid_tool_called: employee_lookup
    expect_contains:
    - EMP_ID=HR-

  # Ход 47 — invoice_get: INV-Q1-001
  - user: "Загрузи инвойс INV-Q1-001."
    expect_contains:
    - INVOICE=INV-Q1-001
    - AMOUNT=
    expect_tool_called: invoice_get
    min_tool_calls_delta: 1
    expect_tool_args:
      invoice_id: INV-Q1-001

  # Ход 48 — invoice_get: INV-Q2-002
  - user: "Инвойс INV-Q2-002."
    expect_contains:
    - INVOICE=INV-Q2-002
    - AMOUNT=
    expect_tool_called: invoice_get
    min_tool_calls_delta: 1
    expect_tool_args:
      invoice_id: INV-Q2-002

  # Ход 49 — invoice_get: INV-Q3-003
  - user: "И последний: инвойс INV-Q3-003."
    expect_contains:
    - INVOICE=INV-Q3-003
    - AMOUNT=
    expect_tool_called: invoice_get
    min_tool_calls_delta: 1
    expect_tool_args:
      invoice_id: INV-Q3-003

  # Ход 50 — recall: tier C-VIP-999
  - user: "Без инструментов: какой tier у C-VIP-999?"
    max_tool_calls_delta: 0
    forbid_tool_called: customer_get
    expect_contains:
    - TIER=

  # Ход 51 — python_doc_lookup: decorators
  - user: "Найди документацию Python по теме decorators."
    expect_contains:
    - REF=PYDOC-778
    expect_tool_called: python_doc_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      topic: decorators

  # Ход 52 — python_doc_lookup: asyncio
  - user: "Теперь документация по asyncio."
    expect_contains:
    - REF=PYDOC-778
    expect_tool_called: python_doc_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      topic: asyncio

  # Ход 53 — benchmark_sse_probe
  - user: "Проверь SSE-соединение пробой."
    expect_contains:
    - amber-91
    expect_tool_called: benchmark_sse_probe
    min_tool_calls_delta: 1

  # Ход 54 — sales_quote: ProSuite
  - user: "Сформируй цитату на ProSuite."
    expect_contains:
    - QUOTE
    - price_usd=
    expect_tool_called: sales_quote
    min_tool_calls_delta: 1
    expect_tool_args:
      product: ProSuite

  # Ход 55 — recall: orchid-17 marker
  - user: "Не вызывая инструменты: какой маркер вернула основная benchmark-проба (CORE)?"
    max_tool_calls_delta: 0
    forbid_tool_called: benchmark_probe
    expect_contains:
    - orchid-17

  # Ход 56 — weather_city: Singapore
  - user: "Командировка в Сингапур — какая там погода?"
    expect_contains:
    - WEATHER
    - Singapore
    expect_tool_called: weather_city
    min_tool_calls_delta: 1
    expect_tool_args:
      city: Singapore

  # Ход 57 — translate_text: German
  - user: "Переведи на немецкий: 'Invoice approved and processed'."
    expect_contains:
    - TRANSLATED[de]
    expect_tool_called: translate_text
    min_tool_calls_delta: 1
    expect_tool_args:
      text: Invoice approved and processed
      target_lang: de

  # Ход 58 — recall: аудит 2024-03-10
  - user: "Без инструментов: что показал SSE аудит за 2024-03-10?"
    max_tool_calls_delta: 0
    forbid_tool_called: sse_audit_log
    expect_contains:
    - AUDIT

  # Ход 59 — org_chart_dept: Finance
  - user: "Покажи org chart отдела Finance."
    expect_contains:
    - DEPT=Finance
    - ROLES=
    expect_tool_called: org_chart_dept
    min_tool_calls_delta: 1
    expect_tool_args:
      department: Finance

  # Ход 60 — recall: инвойс INV-Q1-001
  - user: "Без запроса к системе: напомни сумму инвойса INV-Q1-001."
    max_tool_calls_delta: 0
    forbid_tool_called: invoice_get
    expect_contains:
    - AMOUNT=

  # ============================================================
  # РАУНД 4: ходы 61-80 (КРИТИЧЕСКИЕ ПРОВЕРКИ НА DRIFT)
  # ============================================================

  # Ход 61 — decoy-тест: employee_lookup для Alice Johnson, НЕ decoy_employee_search
  - user: "Найди сотрудника Alice Johnson — нужен актуальный EMP_ID."
    expect_contains:
    - EMP_ID=HR-
    - Alice Johnson
    expect_tool_called: employee_lookup
    min_tool_calls_delta: 1
    forbid_tool_called: decoy_employee_search
    expect_tool_args:
      name: Alice Johnson

  # Ход 62 — decoy-тест: employee_lookup для Frank Lee, НЕ decoy_employee_search
  - user: "Найди Frank Lee в HR-системе."
    expect_contains:
    - EMP_ID=HR-
    - Frank Lee
    expect_tool_called: employee_lookup
    min_tool_calls_delta: 1
    forbid_tool_called: decoy_employee_search
    expect_tool_args:
      name: Frank Lee

  # Ход 63 — decoy-тест: employee_lookup для Grace Park, НЕ decoy_employee_search
  - user: "Мне нужен EMP_ID Grace Park из HR."
    expect_contains:
    - EMP_ID=HR-
    - Grace Park
    expect_tool_called: employee_lookup
    min_tool_calls_delta: 1
    forbid_tool_called: decoy_employee_search
    expect_tool_args:
      name: Grace Park

  # Ход 64 — decoy-тест: employee_lookup для Eva Martinez, НЕ decoy_employee_search
  - user: "Найди Eva Martinez."
    expect_contains:
    - EMP_ID=HR-
    - Eva Martinez
    expect_tool_called: employee_lookup
    min_tool_calls_delta: 1
    forbid_tool_called: decoy_employee_search
    expect_tool_args:
      name: Eva Martinez

  # Ход 65 — decoy-тест: employee_lookup для Bob Chen, НЕ decoy_employee_search
  - user: "Поиск по HR: Bob Chen."
    expect_contains:
    - EMP_ID=HR-
    - Bob Chen
    expect_tool_called: employee_lookup
    min_tool_calls_delta: 1
    forbid_tool_called: decoy_employee_search
    expect_tool_args:
      name: Bob Chen

  # Ход 66 — decoy-тест CRM: customer_get для C-EMEA-001, НЕ decoy_customer_lookup
  - user: "Получи данные клиента C-EMEA-001 из CRM."
    expect_contains:
    - CUSTOMER=C-EMEA-001
    - TIER=
    expect_tool_called: customer_get
    min_tool_calls_delta: 1
    forbid_tool_called: decoy_customer_lookup
    expect_tool_args:
      customer_id: C-EMEA-001

  # Ход 67 — decoy-тест CRM: customer_get для C-VIP-999, НЕ decoy_customer_lookup
  - user: "Загрузи профиль клиента C-VIP-999."
    expect_contains:
    - CUSTOMER=C-VIP-999
    - TIER=
    expect_tool_called: customer_get
    min_tool_calls_delta: 1
    forbid_tool_called: decoy_customer_lookup
    expect_tool_args:
      customer_id: C-VIP-999

  # Ход 68 — decoy-тест CRM: customer_get для C-US-003, НЕ decoy_customer_lookup
  - user: "CRM профиль: C-US-003."
    expect_contains:
    - CUSTOMER=C-US-003
    - TIER=
    expect_tool_called: customer_get
    min_tool_calls_delta: 1
    forbid_tool_called: decoy_customer_lookup
    expect_tool_args:
      customer_id: C-US-003

  # Ход 69 — SSE audit без decoy_sse_cache
  - user: "Запроси SSE аудит-лог за 2024-04-05."
    expect_contains:
    - AUDIT
    - 2024-04-05
    - events=3
    expect_tool_called: sse_audit_log
    min_tool_calls_delta: 1
    forbid_tool_called: decoy_sse_cache
    expect_tool_args:
      date: "2024-04-05"

  # Ход 70 — SSE probe без decoy_sse_cache
  - user: "Запусти SSE-пробу."
    expect_contains:
    - amber-91
    expect_tool_called: benchmark_sse_probe
    min_tool_calls_delta: 1
    forbid_tool_called: decoy_sse_cache

  # Ход 71 — get_policy_fact: anti-hallucination, НЕ decoy
  - user: "Получи текущий policy fact."
    expect_contains:
    - violet-42
    expect_tool_called: get_policy_fact
    min_tool_calls_delta: 1
    forbid_tool_called: decoy_python_lookup

  # Ход 72 — get_policy_fact снова
  - user: "Подтверди policy fact — вызови get_policy_fact ещё раз."
    expect_contains:
    - violet-42
    expect_tool_called: get_policy_fact
    min_tool_calls_delta: 1
