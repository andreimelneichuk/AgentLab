    expect_tool_called: leave_balance
    min_tool_calls_delta: 1
  - user: 'Посчитай стоимость замены сотрудника: средняя зарплата 8500 в месяц, рекрутинг
      = 3 зарплаты. Формула: 8500*3.'
    expect_contains:
