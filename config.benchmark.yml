# Конфиг для бенчмарка (4 MCP-сервера, ~25 tools)

llm_defaults:
  model_alias: "qwen-moe-local"
  attempts_per_model: 1
  model_alias_fallback_chain:
    - "qwen-moe-local"

llm:
  backend_instances:
    vllm_local:
      type: vllm
      api_key: "EMPTY"
      base_url: "http://llm-server.local:8001/v1"
      health_check_url: "http://llm-server.local:8001/health"
      request_timeout: 180

  models:
    qwen-moe-local:
      backends:
        - backend_instance_ref: vllm_local
          backend_model_id: "qwen-moe-local"
          priority: 1
          default_openai_params:
            temperature: 0.3
            top_p: 0.95
            max_tokens: 4096

  request_timeout: 180
  default_max_tokens: 4096
  timeout_healthcheck_timeout: 5

tools:
  call_limit:
    tool_loop_rounds: 5
    thread: 50

agent:
  is_default_bot: false
  is_strict_mode: false
  custom_base_role: |
    Ты — тестовый ассистент для проверки MCP и соблюдения инструкций.
    Всегда вызывай инструменты когда пользователь просит или когда нужен факт из MCP.
    Будь точен и не выдумывай маркеры — только из результатов инструментов.

benchmark:
  judge:
    enabled: true
    temperature: 0.1
    max_tokens: 512
    # model_alias: null  # по умолчанию — та же модель, что и у агента

mcp_servers:
  benchmark_core:
    type: http
    url: http://127.0.0.1:19100/mcp-streamable
  benchmark_hr:
    type: http
    url: http://127.0.0.1:19100/mcp-hr
  benchmark_crm:
    type: http
    url: http://127.0.0.1:19100/mcp-crm
  benchmark_sse:
    type: sse
    url: http://127.0.0.1:19100/mcp-sse

http_backend:
  base_url: "http://127.0.0.1:9094"
  webhook_url: "http://127.0.0.1:19110"
  webhook_port: 19110
  configuration_id: "DEFAULT_AI_ASSISTANT"
  message_timeout_s: 120
