# CI: unit-тесты + бенчмарк (код варианта в original/)
stages:
  - test
  - benchmark

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

.agent_benchmark:
  image: python:3.12-slim
  before_script:
    - pip install -r requirements.txt
  artifacts:
    when: always
    paths:
      - benchmark/results/
    expire_in: 7 days

unit-tests:
  extends: .agent_benchmark
  stage: test
  script:
    - PYTHONPATH=. pytest tests/ -q
    - cd original && PYTHONPATH=. pytest tests/ -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

benchmark-critical:
  extends: .agent_benchmark
  stage: benchmark
  script:
    - python -m benchmark.mcp_mock_server &
    - sleep 3
    - PYTHONPATH=. python -m benchmark.compare
      --variant original
      --tags critical
  rules:
    - when: manual
      allow_failure: true
