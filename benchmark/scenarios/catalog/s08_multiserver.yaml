    expect_contains:
    - EMP_ID=HR-
    - Sergei Nikolaev
    expect_tool_called: employee_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      name: Sergei Nikolaev
  - user: Сколько дней отпуска у Sergei осталось?
    expect_contains:
