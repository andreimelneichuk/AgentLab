scenarios:
- id: s01_001
  description: DevOps проверяет живость MCP endpoint через benchmark_probe и маркер
  tags:
  - balanced
  - catalog
  - smoke
  - suite_balanced
  - suite_tools
  - tool
  - tools
  turns:
  - user: Слушай, не уверен что бэкенд вообще поднят — глянь живой ли сервис и скажи
      какой там маркер
    expect_contains:
    - orchid-17
    expect_tool_called: benchmark_probe
    min_tool_calls_delta: 1
- id: s01_002
  description: Мониторинг запрашивает healthcheck — маркер + краткий статус
  tags:
  - balanced
  - catalog
  - suite_balanced
  - suite_tools
  - tool
  - tools
  turns:
  - user: Алерт кричит что сервис может лежать — чекни плз и коротко напиши статус
    expect_contains:
    - orchid-17
    expect_tool_called: benchmark_probe
    min_tool_calls_delta: 1
    expect_regex:
    - (ок|работ|здоров|active|up|live)
- id: s01_003
  description: Пользователь считает стоимость 3 серверов по 850 $/мес через calc_expression
  tags:
  - balanced
  - catalog
  - suite_balanced
  - suite_tools
  - tool
  - tools
  turns:
  - user: 'Хочу прикинуть расходы на инфру: три сервера по 850 баксов в месяц. Сколько
      в месяц выйдет?'
    expect_contains:
    - '2550'
    expect_tool_called: calc_expression
    min_tool_calls_delta: 1
    expect_tool_args:
      expression: 3*850
- id: s01_004
  description: Финансист рассчитывает ROI инвестиций через calc_expression с проверкой
    аргументов
  tags:
  - balanced
  - catalog
  - critical
  - suite_balanced
  - suite_tools
  - tool
  - tools
  turns:
  - user: 'Нужен ROI по проекту: вложили 45 000, выручка 120 000. Формула (доход −
      затраты) / затраты × 100. Посчитай % возврата'
    expect_contains:
    - RESULT=
    expect_tool_called: calc_expression
    min_tool_calls_delta: 1
    expect_tool_args:
      expression: (120000-45000)/45000*100
- id: s02_001
  description: Разработчик ищет документацию по asyncio через правильный tool, не
    decoy
  tags:
  - balanced
  - catalog
  - s02
  - suite_balanced
  - suite_tools
  - tier1
  - tool
  - tools
  turns:
  - user: Нужна дока по asyncio — как корутины запускать и event loop юзать
    expect_contains:
    - REF=PYDOC-778
    - asyncio
    expect_tool_called: python_doc_lookup
    forbid_tool_called: decoy_python_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      topic: asyncio
- id: s02_002
  description: Тимлид просит объяснить decorators с примерами — lookup на первом ходу,
    recall без tool на втором
  tags:
  - balanced
  - catalog
  - instruction
  - s02
  - suite_balanced
  - suite_tools
  - tier2
  - tool
  - tools
  turns:
  - user: Объясни decorators в Python на примерах — глянь актуальную доку
    expect_contains:
    - REF=PYDOC-778
    - decorator
    expect_tool_called: python_doc_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      topic: decorators
  - user: Ок, а какие примеры использования там были? Коротко перечисли
    expect_contains:
    - decorator
    max_tool_calls_delta: 0
    forbid_tool_called: python_doc_lookup
