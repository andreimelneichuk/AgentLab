scenarios:
- id: s08_001
  description: 'Полный онбординг нового сотрудника: HR-профиль, орг-структура, погода
    в офисе, финский перевод'
  tags:
  - catalog
  - tool
  - long_horizon
  - multiserver
  turns:
  - user: В понедельник выходит Elena Petrova — найди её в HR, хочу подготовиться
    expect_contains:
    - EMP_ID=HR-
    - Elena Petrova
    expect_tool_called: employee_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      name: Elena Petrova
  - user: Отлично. Покажи орг-структуру отдела Marketing — кто за него отвечает.
    expect_contains:
    - DEPT=Marketing
    - ROLES=
    expect_tool_called: org_chart_dept
    min_tool_calls_delta: 1
    expect_tool_args:
      department: Marketing
  - user: Elena едет в наш офис в Хельсинки. Проверь погоду там.
    expect_contains:
    - WEATHER
    - Helsinki
    expect_tool_called: weather_city
    min_tool_calls_delta: 1
    expect_tool_args:
      city: Helsinki
  - user: Подготовь финское приветствие для Елены — переведи 'Welcome to the team,
      Elena!' на финский.
    expect_contains:
    - TRANSLATED[fi]
    expect_tool_called: translate_text
    min_tool_calls_delta: 1
    expect_tool_args:
      target_lang: fi
      text: Welcome to the team, Elena!
  - user: По её HR-профилю из начала разговора — в каком отделе Elena Petrova и кто там руководитель?
    expect_contains:
    - Elena Petrova
    - Engineering
    max_tool_calls_delta: 0
    forbid_tool_called: translate_text
  - user: 'Сводка онбординга одним блоком: имя и HR ID Elena, отдел, погода в Хельсинки,
      финское приветствие'
    expect_contains:
    - Elena Petrova
    - Helsinki
    - TRANSLATED[fi]
    expect_contains_mode: all
    max_tool_calls_delta: 0
- id: s08_002
  description: 'Реакция на прод-инцидент: аудит-лог SSE, дежурный инженер, тикет,
    политика, healthcheck, recall'
  tags:
  - catalog
  - tool
  - long_horizon
  - multiserver
  - critical
  turns:
  - user: Сбой в проде. Вытащи журнал SSE-событий за 2024-06-15 — хочу понять масштаб
    expect_contains:
    - AUDIT
    - '2024-06-15'
    - events=3
    expect_tool_called: sse_audit_log
    min_tool_calls_delta: 1
    expect_tool_args:
      date: '2024-06-15'
  - user: Найди дежурного Dmitry Sokolov — он берёт инцидент
    expect_contains:
    - EMP_ID=HR-
    - Dmitry Sokolov
    expect_tool_called: employee_lookup
    min_tool_calls_delta: 1
    expect_tool_args:
      name: Dmitry Sokolov
  - user: 'Создай тикет с темой ''Production incident 2024-06-15: SSE audit anomaly''.'
    expect_contains:
    - TICKET_ID=TK-
    - status=open
    expect_tool_called: ticket_create
    min_tool_calls_delta: 1
    expect_tool_args:
      subject: 'Production incident 2024-06-15: SSE audit anomaly'
  - user: По регламенту нужна актуальная политика безопасности — возьми из официального
      источника
    expect_contains:
    - violet-42
    expect_tool_called: get_policy_fact
    forbid_tool_called: decoy_policy_fact
    min_tool_calls_delta: 1
  - user: Сделай базовую проверку, что система живая — нужен контрольный маркер
    expect_contains:
    - orchid-17
    expect_tool_called: benchmark_probe
    min_tool_calls_delta: 1
  - user: 'Собери факты по инциденту: дата из журнала, имя дежурного и номер тикета'
    expect_contains:
    - '2024-06-15'
    - Dmitry Sokolov
    - TK-
    max_tool_calls_delta: 0
    forbid_tool_called: benchmark_probe
  - user: 'И напомни контрольный маркер системы и правило из политики безопасности'
    expect_contains:
    - orchid-17
    - violet-42
    expect_contains_mode: all
    max_tool_calls_delta: 0
- id: s08_003
  description: 'Полная квалификация клиента: CRM-профиль, коммерческий оффер, счёт,
    расчёт ROI, recall'
  tags:
  - catalog
  - tool
  - long_horizon
  - multiserver
  turns:
  - user: Надо разобраться с клиентом C-2024-777 — открой его профиль в CRM
    expect_contains:
    - CUSTOMER=C-2024-777
    - TIER=gold
    expect_tool_called: customer_get
    min_tool_calls_delta: 1
    expect_tool_args:
      customer_id: C-2024-777
  - user: Подготовь коммерческое предложение — продукт называется EnterpriseCloud.
    expect_contains:
    - QUOTE
    - price_usd=
    expect_tool_called: sales_quote
    min_tool_calls_delta: 1
    expect_tool_args:
      product: EnterpriseCloud
  - user: Открой счёт INV-Q3-2024 — клиент раньше покупал у нас, хочу сверить историю
    expect_contains:
    - INVOICE=INV-Q3-2024
    - AMOUNT=
    expect_tool_called: invoice_get
    min_tool_calls_delta: 1
    expect_tool_args:
      invoice_id: INV-Q3-2024
  - user: 'Посчитай ROI: клиент вложил 12500, ожидаемая выручка от EnterpriseCloud
      — 50000. Формула: (50000-12500)/12500*100.'
    expect_contains:
    - RESULT=
    expect_tool_called: calc_expression
    min_tool_calls_delta: 1
    expect_tool_args:
      expression: (50000-12500)/12500*100
  - user: 'Коротко: какой сегмент у C-2024-777 и какой продукт в оффере?'
    expect_contains:
    - C-2024-777
    - EnterpriseCloud
    max_tool_calls_delta: 0
  - user: 'Теперь полный финансовый итог: сумма счёта, цена оффера и ROI'
    expect_contains:
    - AMOUNT=
    - QUOTE
    - RESULT=
    expect_contains_mode: all
    max_tool_calls_delta: 0
- id: s08_004
  description: 'Подготовка командировки в Сингапур: погода, перевод брифинга на китайский,
    контакт на месте, recall'
  tags:
